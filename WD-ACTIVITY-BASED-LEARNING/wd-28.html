<!DOCTYPE html>
<html>
<head>
    <title>Registration & Login</title>
    <style>
        body{
            font-family:Arial, sans-serif;
            background-color:#f4f4f4;
            margin:0;
            padding:20px;
        }

        .container{
            width:400px;
            margin:auto;
        }

        .box{
            background:white;
            padding:20px;
            margin-bottom:20px;
            border-radius:8px;
        }

        h2{
            text-align:center;
            color:#0066cc;
        }

        label{
            font-weight:bold;
        }

        input{
            width:100%;
            padding:8px;
            margin-top:5px;
            margin-bottom:10px;
        }

        button{
            width:100%;
            padding:10px;
            background:#0066cc;
            color:white;
            border:none;
        }
    </style>
</head>
<body>

<div class="container">

    <div class="box">
        <h2>Registration Form</h2>

        <form>
            <label>Full Name</label>
            <input type="text" required>

            <label>Email</label>
            <input type="email" required>

            <label>Password</label>
            <input type="password" required>

            <label>Confirm Password</label>
            <input type="password" required>

            <button type="submit">Register</button>
        </form>
    </div>

    <div class="box">
        <h2>Login Form</h2>

        <form>
            <label>Email</label>
            <input type="email" required>

            <label>Password</label>
            <input type="password" required>

            <button type="submit">Login</button>
        </form>
    </div>

</div>

</body>
</html>
