<!DOCTYPE html>
<html>
<head>
    <title>Bus & Train Ticket Booking</title>

    <style>
        body{
            font-family:Arial, sans-serif;
            background-color:#f4f4f4;
            margin:0;
            padding:20px;
        }

        .booking-form{
            width:500px;
            margin:auto;
            background:white;
            padding:20px;
            border-radius:8px;
        }

        h1{
            text-align:center;
            color:#0066cc;
        }

        label{
            font-weight:bold;
        }

        input,select{
            width:100%;
            padding:8px;
            margin-top:5px;
            margin-bottom:10px;
        }

        button{
            width:100%;
            padding:10px;
            background:#0066cc;
            color:white;
            border:none;
        }
    </style>

</head>
<body>

<div class="booking-form">

    <h1>Ticket Booking</h1>

    <form>

        <label>Source</label>
        <input type="text" placeholder="Enter Source">

        <label>Destination</label>
        <input type="text" placeholder="Enter Destination">

        <label>Travel Date</label>
        <input type="date">

        <label>Number of Passengers</label>
        <input type="number">

        <label>Transport Type</label>
        <select>
            <option>Bus</option>
            <option>Train</option>
        </select>

        <label>Seat Preference</label>
        <select>
            <option>Window</option>
            <option>Middle</option>
            <option>Aisle</option>
        </select>

        <button type="submit">Book Ticket</button>

    </form>

</div>

</body>
</html>
